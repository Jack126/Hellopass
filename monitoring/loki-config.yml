auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

query_range:
  results_cache:
    cache_config:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093
  ring:
    kvstore: memberlist
  enable_api: true
  enable_alertmanager_v2: true

# By default, Loki will send anonymous usage information to Grafana Labs.
# To disable this, set analytics_reporting_enabled: false
analytics:
  reporting_enabled: false