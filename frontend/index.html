<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecurePass - 安全密码管理器</title>
    <meta name="description" content="一个安全、开源的密码管理器，帮助您管理所有密码" />
    <meta name="keywords" content="password manager, security, password, secure, open source" />
    <meta name="author" content="SecurePass Team" />
    <meta name="theme-color" content="#667eea" />
    
    <!-- 预加载关键资源 -->
    <link rel="preload" href="/src/main.ts" as="script" />
    <link rel="preload" href="/src/App.vue" as="script" />
    <link rel="preload" href="/src/components/PasswordManager.vue" as="script" />
    
    <!-- 预连接到API服务器 -->
    <link rel="preconnect" href="http://localhost:8000" />
    
    <!-- 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        color: #333;
      }
      
      #app {
        min-height: 100vh;
      }
      
      /* 加载动画 */
      .loading-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* 隐藏滚动条但保持滚动功能 */
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      
      /* 响应式设计 */
      @media (max-width: 768px) {
        .header-content {
          flex-direction: column;
          gap: 15px;
        }
        
        .header-actions {
          flex-wrap: wrap;
          justify-content: center;
        }
        
        .welcome-actions {
          flex-direction: column;
          width: 100%;
        }
        
        .welcome-actions .el-button {
          width: 100%;
        }
      }
      
      @media (max-width: 480px) {
        .content-wrapper {
          padding: 0 10px;
        }
        
        .password-item {
          flex-direction: column;
          gap: 10px;
          align-items: flex-start;
        }
        
        .password-actions {
          width: 100%;
          justify-content: flex-end;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="loading-container" id="loading-container">
      <div class="loading-spinner"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 检测浏览器支持
      if (!window.crypto || !window.crypto.subtle) {
        alert('您的浏览器不支持加密功能，请使用现代浏览器访问。');
      }
      
      // 检测 HTTPS
      if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
        console.warn('建议使用 HTTPS 协议以确保安全性');
      }
      
      // 页面加载完成后隐藏加载动画
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loadingContainer = document.getElementById('loading-container');
          if (loadingContainer) {
            loadingContainer.style.opacity = '0';
            loadingContainer.style.transition = 'opacity 0.3s ease';
            setTimeout(() => {
              loadingContainer.style.display = 'none';
            }, 300);
          }
        }, 500);
      });
    </script>
  </body>
</html>
