[package]
name = "securepass"
version = "1.0.0"
description = "A secure password manager"
authors = ["Your Name"]
edition = "2021"

[lib]
name = "securepass"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "securepass"
path = "../src/main_tauri.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "0.8", features = ["v4", "serde"] }
aes = "0.8"
cipher = "0.4"
rand = "0.8"
sha2 = "0.9"
thiserror = "1.0"
serde_json = "1.0"
rusqlite = { version = "0.28", features = ["bundled"] }
pbkdf2 = "0.11"
hmac = "0.12"
tauri = { version = "1.5", features = ["notification", "dialog", "fs", "path", "window-all", "tray-icon"] }