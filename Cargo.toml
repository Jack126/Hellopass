[package]
name = "securepass"
version = "1.0.0"
description = "跨平台密码管理器"
authors = ["Your Name <your.email@example.com>"]
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = ["api-all", "system-tray", "notification"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
tokio = { version = "1.0", features = ["full"] }
aes = "0.8"
gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.21"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "5.0"
path-slash = "0.2"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]