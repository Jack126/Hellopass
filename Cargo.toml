[package]
name = "securepass"
version = "0.1.0"
edition = "2021"
default-run = "securepass_tauri"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "0.8", features = ["v4", "serde"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
thiserror = "1.0"
serde_json = "1.0"
rusqlite = { version = "0.28", features = ["bundled"] }
pbkdf2 = "0.11"
hmac = "0.12"
base64 = "0.21"
# Tauri 是桌面应用的核心依赖。它仅在构建 securepass_tauri 二进制时需要，
# 因此放在可选的 tauri-app 特性后并设为默认特性，
# 这样 `cargo tauri dev` / `cargo build` 开箱即用，无需手动加 --features。
# 缺少 webkit2gtk/libdbus 的纯 headless 环境可用
# `cargo test --bin securepass --no-default-features` 跑核心单元测试。
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }

[[bin]]
name = "securepass"
path = "src/main.rs"

[[bin]]
name = "securepass_tauri"
path = "src/main_tauri.rs"

[build-dependencies]
tauri-build = { version = "2", optional = true }

[features]
default = ["tauri-app"]
tauri-app = ["dep:tauri", "dep:tauri-build"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
strip = true