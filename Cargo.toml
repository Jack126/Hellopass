[package]
name = "securepass"
version = "0.1.0"
edition = "2021"
default-run = "securepass"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "0.8", features = ["v4", "serde"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
thiserror = "1.0"
serde_json = "1.0"
rusqlite = { version = "0.28", features = ["bundled"] }
pbkdf2 = "0.11"
hmac = "0.12"
base64 = "0.21"
# 敏感内存清零（主密钥、解密后的明文缓冲区）
zeroize = { version = "1", features = ["derive"] }
# Tauri 是桌面应用的核心依赖。它仅在构建 securepass 二进制时需要，
# 因此放在可选的 tauri-app 特性后并设为默认特性，
# 这样 `cargo tauri dev` / `cargo build` 开箱即用，无需手动加 --features。
# 缺少 webkit2gtk/libdbus 的纯 headless 环境可用
# `cargo test --bin securepass_cli --no-default-features` 跑核心单元测试。
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
pinyin = "0.11"

# GUI 二进制名必须与 package 名一致：Tauri CLI 用 package 名定位主二进制，
# 名字不一致时 bundler 会把另一个 bin 改名覆盖掉 GUI（之前踩过）。
[[bin]]
name = "securepass"
path = "src/main_tauri.rs"

# 无头自测/演示入口（不依赖 tauri，可在无 GUI 环境跑测试）
[[bin]]
name = "securepass_cli"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[features]
default = ["tauri-app"]
tauri-app = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-global-shortcut",


    "dep:tauri-plugin-clipboard-manager",
]

# 依赖（pbkdf2/sha2/aes-gcm 等）在 dev 下也开优化。
# 未优化的 600k 次 PBKDF2 单次就要 8 秒左右，登录会卡十几秒。
[profile.dev.package."*"]
opt-level = 2

[profile.test.package."*"]
opt-level = 2

[profile.dev]
# PBKDF2/HMAC 是泛型，会被单态化进本 crate，依赖开优化还不够。
# opt-level=0 时单次 600k PBKDF2 要数秒，登录会明显卡顿。
opt-level = 2
debug = true

[profile.release]
opt-level = 3
lto = true
strip = true
