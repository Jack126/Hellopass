[package]
name = "securepass"
version = "1.0.0"
description = "跨平台密码管理器"
authors = ["Your Name <your.email@example.com>"]
edition = "2021"
rust-version = "1.70"

[dependencies]
# tauri = { version = "1.2", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = "0.28"
tokio = { version = "1.0", features = ["rt", "macros"] }
aes = "0.8"
cipher = "0.4"
pbkdf2 = "0.12"
sha2 = "0.9"
rand = "0.7"
base64 = "0.20"
thiserror = "1.0"
# anyhow = "1.0"
# tracing = "0.1"
chrono = "0.4.19"
uuid = { version = "0.8", features = ["v4", "serde"] }
# dirs = "5.0"
# path-slash = "0.2"

# [build-dependencies]
# tauri-build = "1.2"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

# [features]
# default = ["custom-protocol"]
# custom-protocol = ["tauri/custom-protocol"]